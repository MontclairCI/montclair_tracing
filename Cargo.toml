[package]
name = "montclair_tracing"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clickhouse = { version = "0.15.3", features = ["time", "uuid"] }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["local-offset", "formatting", "macros"] }
tokio = { version = "1.54.1", features = ["io-util", "fs", "rt-multi-thread"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"

[lib]
name = "montclair_tracing"
path = "src/lib.rs"

[[bin]]
name = "observability"
path = "src/cmd/observability.rs"
